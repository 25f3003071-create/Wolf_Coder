<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — ReliefTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: { 950: '#020617', 900: '#090d16', 800: '#1e293b' },
            emerald: { 400: '#34d399', 500: '#10b981', 600: '#059669' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between text-xs">

  <header class="sticky top-0 z-40 w-full bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="p-2 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        </div>
        <span class="text-lg font-black tracking-tight text-white">Relief<span class="text-emerald-400">Track</span></span>
      </a>

      <div class="flex items-center gap-3">
        <button onclick="ReliefTrack.logout()" class="btn btn-outline btn-sm">Logout</button>
        <button id="wallet-connect-btn" onclick="openWalletModal()" class="btn btn-primary btn-sm">Connect Wallet</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-10 space-y-6 flex-grow">
    <div class="space-y-1">
      <h1 class="text-2xl font-black text-slate-100">User Settings &amp; Web3 Security</h1>
      <p class="text-slate-400">Manage account credentials, notification triggers &amp; wallet permissions</p>
    </div>

    <div class="card-panel space-y-4">
      <h3 class="text-base font-bold text-slate-100 border-b border-slate-800 pb-2">Profile Preferences</h3>
      <form onsubmit="alert('Settings saved!'); return false;" class="space-y-3">
        <div>
          <label class="block font-semibold mb-1">Display Name</label>
          <input type="text" value="Rahul Sharma" class="input-field">
        </div>
        <div>
          <label class="block font-semibold mb-1">Email Address</label>
          <input type="email" value="donor@relieftrack.org" class="input-field font-mono">
        </div>
        <div class="pt-2">
          <button type="submit" class="btn btn-primary btn-md">Save Settings</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="border-t border-slate-800/80 bg-slate-950/60 py-6 text-center text-slate-500">
    © 2026 ReliefTrack Protocol
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
