<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — ReliefTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: { 950: '#020617', 900: '#090d16', 800: '#1e293b' },
            emerald: { 400: '#34d399', 500: '#10b981', 600: '#059669' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between text-xs">

  <header class="sticky top-0 z-40 w-full bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="p-2 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        </div>
        <span class="text-lg font-black tracking-tight text-white">Relief<span class="text-emerald-400">Track</span></span>
      </a>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-lg space-y-5">
      <div class="text-center space-y-1.5">
        <h1 class="text-2xl font-black text-slate-100">Create Account</h1>
        <p class="text-slate-400">Register on ReliefTrack Emergency Relief Protocol</p>
      </div>

      <div class="card-panel">
        <form onsubmit="handleRegister(event)" class="space-y-4">
          <div>
            <label class="block font-semibold text-slate-300 mb-1">Select Account Role *</label>
            <select id="reg-role" onchange="toggleRegRole(this.value)" class="select-field">
              <option value="DONOR">Donor (Individual / Corporate)</option>
              <option value="NGO">NGO Partner Organization</option>
              <option value="MANAGER">Manager / Auditor</option>
            </select>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-slate-300 mb-1">Full Name / Org Name *</label>
              <input type="text" required placeholder="e.g. Rahul Sharma" class="input-field">
            </div>
            <div>
              <label class="block font-semibold text-slate-300 mb-1">Email Address *</label>
              <input type="email" required placeholder="name@domain.org" class="input-field">
            </div>
            <div>
              <label class="block font-semibold text-slate-300 mb-1">Phone Number *</label>
              <input type="tel" required placeholder="+91 98765 43210" class="input-field">
            </div>
            <div>
              <label class="block font-semibold text-slate-300 mb-1">Password *</label>
              <input type="password" required minlength="8" class="input-field">
            </div>
          </div>

          <div id="ngo-extra-fields" class="space-y-3 p-3 rounded-xl bg-slate-950 border border-slate-800 hidden">
            <p class="font-bold text-emerald-400 uppercase text-[10px]">NGO Credentials</p>
            <div>
              <label class="block font-semibold text-slate-300 mb-1">80G / FCRA Registration Number</label>
              <input type="text" placeholder="AAATC1234F2026" class="input-field">
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-md w-full">
            Register &amp; Access Protocol
          </button>

          <div class="pt-3 border-t border-slate-800 text-center text-slate-400">
            Already have an account? <a href="login.html" class="text-emerald-400 font-bold hover:underline">Log in</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800/80 bg-slate-950/60 py-6 text-center text-slate-500">
    © 2026 ReliefTrack Protocol
  </footer>

  <script src="js/app.js"></script>
  <script>
    function toggleRegRole(role) {
      const extra = document.getElementById('ngo-extra-fields');
      if (role === 'NGO') extra.classList.remove('hidden');
      else extra.classList.add('hidden');
    }

    function handleRegister(e) {
      e.preventDefault();
      const role = document.getElementById('reg-role').value;
      ReliefTrack.saveSession(role);
      if (role === 'DONOR') window.location.href = 'donor.html';
      else if (role === 'NGO') window.location.href = 'ngo.html';
      else if (role === 'MANAGER') window.location.href = 'manager.html';
    }
  </script>
</body>
</html>
